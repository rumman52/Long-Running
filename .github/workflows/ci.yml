name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned uv
        run: python -m pip install "uv==0.10.0"

      - name: Generate universal dependency lock
        run: uv lock

      - name: Upload generated lockfile for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-lockfile
          path: uv.lock
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run runtime example
        run: python examples/long_running_task.py

      - name: Run external reconciliation example
        run: python examples/external_reconciliation.py

      - name: Run Ruff
        run: ruff check src tests examples benchmarks

      - name: Run mypy
        run: mypy src/intent_integrity


  m7-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run M7 evaluation regression tests
        run: pytest tests/test_m7_evaluation.py tests/conformance/test_async_tool_spec_adapter.py -q

      - name: Run synthetic M7 evaluation
        run: python benchmarks/evaluate_m7.py --output "$RUNNER_TEMP/m7-evaluation.json"

      - name: Upload M7 evaluation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m7-evaluation
          path: |
            ${{ runner.temp }}/m7-evaluation.json
            ${{ runner.temp }}/m7-evaluation.md

  langgraph-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - langgraph-version: "0.2.74"
            prebuilt-version: ""
          - langgraph-version: "1.0.8"
            prebuilt-version: "1.0.7"
          - langgraph-version: "1.2.18"
            prebuilt-version: "1.1.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install base test dependencies and selected LangGraph version
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "langgraph==${{ matrix.langgraph-version }}"
          if [ -n "${{ matrix.prebuilt-version }}" ]; then
            python -m pip install "langgraph-prebuilt==${{ matrix.prebuilt-version }}"
          fi

      - name: Run LangGraph ToolNode conformance tests
        run: pytest tests/conformance/test_langgraph_adapter.py -q

  platform-storage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run persistence and reconciliation tests
        run: pytest tests/test_store_concurrency.py tests/test_store_operations.py tests/test_reconciliation.py tests/test_state_properties.py -q

      - name: Run external reconciliation example
        run: python examples/external_reconciliation.py

  python-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15 (best effort, not yet a supported release target)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run runtime example
        run: python examples/long_running_task.py
