name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run runtime example
        run: python examples/long_running_task.py

      - name: Run external reconciliation example
        run: python examples/external_reconciliation.py

      - name: Run Ruff
        run: ruff check src tests examples benchmarks

      - name: Run mypy
        run: mypy src/intent_integrity


  m7-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run M7 evaluation regression tests
        run: pytest tests/test_m7_evaluation.py tests/conformance/test_shuddho_adapter.py -q

      - name: Run synthetic M7 evaluation
        run: python benchmarks/evaluate_m7.py --output "$RUNNER_TEMP/m7-evaluation.json"

      - name: Upload M7 evaluation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m7-evaluation
          path: |
            ${{ runner.temp }}/m7-evaluation.json
            ${{ runner.temp }}/m7-evaluation.md

  langgraph-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install LangGraph integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langgraph]"

      - name: Run LangGraph ToolNode conformance tests
        run: pytest tests/conformance/test_langgraph_adapter.py -q

  python-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15 (best effort, not yet a supported release target)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run runtime example
        run: python examples/long_running_task.py
