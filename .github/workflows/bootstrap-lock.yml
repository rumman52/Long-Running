name: Bootstrap uv lockfile

on:
  push:
    branches:
      - m2-m7-release-engineering-20261031

permissions:
  contents: write

jobs:
  bootstrap-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-engineering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned uv
        run: python -m pip install "uv==0.10.0"

      - name: Generate universal lockfile
        run: uv lock

      - name: Commit lockfile to this working branch
        shell: bash
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add universal uv dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
