[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-integrity"
version = "0.1.0"
description = "Framework-neutral intent drift validation for long-running AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Intent Integrity contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["intent_integrity"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
